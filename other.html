<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gisella Villarreal | Diseño Web & Experiencias Digitales</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-dark: #151515;      
      --bg-cream: #c9bb9e;     
      --text-main: #FFFFFF;    
      --text-light: #b0b0b0;   
      --border-color: rgba(255, 255, 255, 0.15); 
      --silver-accent: #D3D3D3; 
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-dark); 
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    
    .page-wrapper {
      max-width: 100%;
      margin: 0 auto;
      overflow-x: hidden;
    }

    /* ====== ENCABEZADO FIJO TRANSPARENTE ====== */
    .top-bar {
      position: fixed; 
      top: 0; left: 0; right: 0;
      background-color: transparent;
      backdrop-filter: none;
      -webkit-backdrop-filter: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      border-bottom: 1px solid transparent;
      z-index: 1000;
      transition: background-color 0.4s ease, backdrop-filter 0.4s ease, border-bottom 0.4s ease;
    }
    
    .top-bar.scrolled {
      background-color: rgba(201, 187, 158, 0.95);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-style: italic;
      font-weight: 500;
      color: var(--bg-dark); 
      text-decoration: none;
    }

    .menu-icon {
      font-size: 1.8rem;
      color: var(--bg-dark); 
      cursor: pointer;
    }
    
    /* ====== HERO ====== */
    .hero { 
      position: relative;
      width: 100%;
      height: 85vh;
      min-height: 550px;
      background-image: url('1791056211701~3.jpg'); 
      background-size: cover; 
      background-position: top center; 
      display: flex;
      flex-direction: column;
      justify-content: flex-end; 
      padding: 20px 20px 90px 20px; 
      text-align: left;
    }

    .hero-fade {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 55%; 
      background: linear-gradient(to top, var(--bg-dark) 0%, rgba(21, 21, 21, 0.8) 35%, transparent 100%);
      z-index: 1;
    }

    .hero-content {
      position: relative;
      z-index: 2; 
    }
    
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 15px;
      color: white; 
    }
    .hero h1 i {
      font-weight: 400;
      font-style: italic;
      color: var(--silver-accent);
    }
    
    .hero p {
      font-size: 0.9rem;
      color: #E2DDD5;
      line-height: 1.5;
      margin: 0 0 25px 0;
      max-width: 90%;
    }
    
    /* BOTONES GLOBALES */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: flex-start;
      gap: 15px;
    }

    .pill-btn {
      background-color: var(--bg-cream);
      color: var(--bg-dark);
      padding: 6px 6px 6px 18px; 
      border-radius: 40px;
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      display: inline-flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.3s ease;
      gap: 12px;
    }
    .pill-btn:hover {
      background-color: white;
    }
    .btn-icon {
      background-color: var(--bg-dark);
      color: var(--bg-cream);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-icon i {
      font-size: 1rem;
    }

    .pill-btn-outline {
      background-color: transparent;
      color: var(--bg-cream);
      padding: 6px 10px 6px 0; 
      font-family: 'Inter', sans-serif;
      font-weight: 700;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.3s ease;
    }
    .pill-btn-outline:hover {
      opacity: 0.7;
    }
    .btn-icon-transparent {
      color: var(--bg-cream);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-icon-transparent i {
      font-size: 1.2rem;
    }

    /* ====== FRANJA DE CONFIANZA ====== */
    .black-stats {
      background-color: var(--bg-dark);
      color: white;
      margin: 0; 
      padding: 0 10px 30px; 
      display: grid;
      grid-template-columns: 1fr 1fr 1fr; 
      align-items: start; 
    }
    
    .stat-item {
      text-align: center; 
      padding: 0 5px; 
    }
    
    .stat-item:not(:last-child) {
      border-right: 1px solid var(--border-color); 
    }

    .stat-item i {
      font-size: 1.8rem;
      margin-bottom: 8px;
      color: var(--silver-accent);
    }
    .stat-item h4 {
      font-size: 0.65rem;
      font-weight: 600;
      margin-bottom: 4px;
      line-height: 1.2;
    }
    .stat-item p {
      font-size: 0.55rem;
      color: #999;
      line-height: 1.3;
    }

    /* ====== TÍTULOS DE SECCIÓN ====== */
    .section-header-container {
      padding: 0 20px;
    }
    .section-header {
      margin-bottom: 30px;
      text-align: center; 
    }
    .section-title {
      font-family: 'Playfair Display', serif; 
      font-style: italic;
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--bg-cream); 
      line-height: 1;
      margin-bottom: 5px;
      letter-spacing: -0.5px;
    }

    /* ====== SECCIÓN DE SERVICIOS (NUEVO DISEÑO 2 COLUMNAS) ====== */
    .services-section {
      background-color: var(--bg-dark); 
      padding-top: 20px;
      padding-bottom: 50px;
    }

    .services-grid-new {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      padding: 0 20px;
    }

    .srv-card {
      background-color: transparent; 
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .srv-card-img {
      width: 100%;
      height: 220px;
      background-size: cover;
      background-position: center;
    }

    .srv-card-body {
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }

    .srv-card-title {
      font-family: 'Inter', sans-serif;
      font-size: 1.3rem;
      font-weight: 700;
      color: white;
      margin-bottom: 10px;
      line-height: 1.3;
      letter-spacing: -0.5px;
    }

    .srv-card-desc {
      font-size: 0.8rem;
      color: var(--text-light);
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .srv-feature {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      margin-bottom: 25px;
    }
    .srv-feature:last-child {
      margin-bottom: 0;
    }

    .srv-feature-icon {
      color: white;
      font-size: 1.4rem;
      margin-top: 2px;
      flex-shrink: 0;
    }

    .srv-feature-text h4 {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      font-weight: 700;
      color: white;
      margin-bottom: 5px;
    }

    .srv-feature-text p {
      font-size: 0.75rem;
      color: #999;
      line-height: 1.5;
    }

    /* ====== TRABAJOS DESTACADOS & MÁS SERVICIOS (CARRUSELES) ====== */
    .carousel-section {
      padding: 40px 0 30px 0; 
      background-color: var(--bg-dark);
      position: relative;
    }

    .carousel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin-bottom: 30px;
    }

    .carousel-title {
      font-family: 'Playfair Display', serif; 
      font-style: italic;
      font-size: 2.5rem;
      font-weight: 500;
      color: var(--bg-cream); 
      line-height: 1;
      margin: 0;
      letter-spacing: -0.5px;
    }

    .carousel-controls {
      display: flex;
      gap: 8px;
    }

    .carousel-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      color: white;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .carousel-btn:hover {
      background: var(--bg-cream);
      color: var(--bg-dark);
      border-color: var(--bg-cream);
    }

    .carousel-grid {
      display: flex;
      gap: 15px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      padding: 0 20px 20px 20px;
      scrollbar-width: none; 
      -ms-overflow-style: none; 
    }
    
    .carousel-grid::-webkit-scrollbar {
      display: none; 
    }

    /* Tarjetas de Trabajos Destacados */
    .work-card {
      min-width: 75%; 
      max-width: 290px;
      scroll-snap-align: center;
      border: 1px solid var(--border-color);
      padding: 16px; 
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      flex-shrink: 0;
      transition: border-color 0.3s ease;
    }
    .work-card:hover { border-color: var(--bg-cream); }

    .work-info { margin-bottom: 12px; display: flex; flex-direction: column; align-items: flex-start; }
    .work-num { font-family: 'Inter', sans-serif; font-size: 0.75rem; color: var(--text-light); margin-bottom: 5px; display: block; }
    .work-name { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 500; color: white; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
    .work-category { font-family: 'Inter', sans-serif; font-size: 0.65rem; color: var(--text-light); }

    /* Detalles del Caso de Estudio */
    .case-study-details { margin-top: 8px; width: 100%; }
    .case-title { font-family: 'Inter', sans-serif; font-size: 0.85rem; font-weight: 700; color: white; margin-bottom: 2px; }
    .case-subtitle { font-family: 'Inter', sans-serif; font-size: 0.7rem; color: var(--text-light); margin-bottom: 8px; }
    .case-list { list-style: none; padding-left: 0; margin-bottom: 0; }
    .case-list li { font-family: 'Inter', sans-serif; font-size: 0.65rem; color: var(--silver-accent); margin-bottom: 4px; position: relative; padding-left: 10px; line-height: 1.3; }
    .case-list li::before { content: '•'; position: absolute; left: 0; color: var(--bg-cream); }
    .case-footer-note { font-family: 'Inter', sans-serif; font-size: 0.5rem; color: #777; margin-top: 10px; line-height: 1.3; text-align: left; }
    
    .work-btn { margin-top: 12px; display: inline-flex; align-items: center; gap: 8px; font-family: 'Inter', sans-serif; font-size: 0.65rem; font-weight: 700; color: var(--bg-cream); text-transform: uppercase; letter-spacing: 1px; transition: color 0.3s ease; }
    .work-card:hover .work-btn { color: white; }

    .work-img-wrapper { width: 100%; height: 170px; overflow: hidden; border-radius: 4px; margin-top: auto; }
    .work-img { width: 100%; height: 100%; background-size: cover; background-position: top center; background-color: #222; transition: transform 0.5s ease; }
    .work-card:hover .work-img { transform: scale(1.03); }

    /* Tarjetas de Más Servicios (Carrusel) con Estética Compacta */
    .more-service-card {
      min-width: 85%;
      max-width: 350px; /* Un poco más ancho para formato horizontal */
      scroll-snap-align: center;
      display: flex;
      flex-direction: row; /* Imagen a un lado, texto al otro */
      align-items: center;
      gap: 15px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      background-color: transparent;
      flex-shrink: 0;
      transition: border-color 0.3s ease;
    }
    
    .more-service-card:hover {
      border-color: var(--bg-cream);
    }

    .more-service-img {
      width: 90px;
      height: 90px;
      border-radius: 12px;
      object-fit: cover;
      flex-shrink: 0;
    }

    .more-service-content {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      width: 100%;
    }

    .more-service-content h3 {
      font-family: 'Inter', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      margin-bottom: 6px;
    }

    .more-service-badge {
      background-color: rgba(255,255,255,0.1);
      color: var(--text-light);
      font-size: 0.6rem;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 8px;
      display: inline-block;
      font-weight: 600;
    }

    .more-service-content p {
      font-size: 0.8rem;
      color: var(--silver-accent);
      line-height: 1.4;
    }
    
    .more-service-price {
      font-family: 'Inter', sans-serif;
      font-size: 0.85rem;
      color: var(--bg-cream);
      font-weight: 700;
      margin-top: 6px;
    }

    /* ====== SOBRE MÍ (FONDO NEGRO) ====== */
    .about-section {
      background-color: var(--bg-dark); 
      padding: 20px 20px 40px;
    }
    
    .about-header {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }
    
    .about-img {
      width: 110px; 
      height: 110px;
      background-image: url('1791049708095~2.jpg'); 
      background-size: cover;
      background-position: center;
      border-radius: 50%; 
      flex-shrink: 0;
    }
    
    .about-header-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .about-header-text .greeting {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-style: italic;
      font-weight: 600;
      margin-bottom: 12px;
      color: white; 
      text-align: left; 
    }
    
    .about-socials {
      display: flex;
      justify-content: flex-start; 
      align-items: center;
      gap: 15px;
    }
    .about-socials a {
      color: white; 
      font-size: 1.5rem;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .about-socials a:hover {
      opacity: 0.7;
      color: var(--bg-cream);
    }

    .about-text p {
      font-size: 0.85rem;
      color: var(--text-light); 
      line-height: 1.6;
      margin-bottom: 15px;
    }

    /* ====== PREGUNTAS FRECUENTES (FAQ SIN RELLENO) ====== */
    .faq-section {
      padding: 30px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 15px; 
      background-color: var(--bg-dark);
    }

    .faq-item {
      background-color: transparent; 
      border-radius: 0; 
      border: none;
      border-bottom: 1px solid var(--border-color); 
      overflow: hidden;
    }
    
    .faq-question {
      padding: 20px 5px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 700;
      color: white; 
    }
    
    .faq-question i {
      transition: transform 0.3s ease;
      color: white; 
    }
    
    .faq-item.active .faq-question i {
      transform: rotate(180deg);
    }
    
    .faq-answer {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease;
      font-size: 0.85rem;
      color: var(--text-light); 
      line-height: 1.6;
      padding: 0 5px; 
    }
    
    .faq-item.active .faq-answer {
      max-height: 300px;
      padding-bottom: 25px;
    }

    /* ====== CTA ====== */
    .cta-container {
      padding: 0;
    }
    .cta-box {
      background-color: var(--bg-dark);
      border-radius: 0; 
      padding: 60px 20px 80px; 
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cta-title {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 2.2rem;
      font-weight: 500;
      color: var(--bg-cream); 
      margin-bottom: 15px;
      line-height: 1.1;
    }
    .cta-desc {
      font-size: 0.85rem;
      color: var(--text-light);
      line-height: 1.6;
      margin-bottom: 35px;
      max-width: 400px;
    }

    /* ====== FOOTER ====== */
    footer {
      padding: 50px 20px 30px;
      text-align: left; 
      background-color: var(--bg-dark); 
    }
    .footer-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-style: italic;
      font-weight: 500;
      color: white; 
      margin-bottom: 10px;
    }
    .footer-desc {
      font-size: 0.75rem;
      color: var(--text-light);
      margin-bottom: 30px;
      max-width: 300px;
    }
    
    .footer-nav-title {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 15px; 
      color: white; 
    }
    
    .footer-links-grid {
      display: grid;
      grid-template-columns: auto auto; 
      gap: 12px 20px;
      margin-bottom: 35px;
    }
    .footer-links-grid a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.8rem;
      transition: color 0.2s;
    }
    .footer-links-grid a:hover {
      color: var(--bg-cream);
    }

    .footer-social {
      display: flex;
      justify-content: flex-start;
      gap: 15px;
      margin-bottom: 25px; 
    }
    .footer-social a {
      color: white; 
      font-size: 1.5rem;
      text-decoration: none;
      transition: color 0.2s;
    }
    .footer-social a:hover {
      color: var(--bg-cream);
    }
    
    .footer-divider {
      border: none;
      border-top: 1px solid var(--border-color);
      margin-bottom: 20px;
    }
    .footer-bottom-text {
      font-size: 0.7rem;
      color: var(--text-light);
      margin-bottom: 10px;
    }
    .footer-legal a {
      color: var(--text-light);
      text-decoration: none;
      font-size: 0.7rem;
      margin-right: 10px;
    }

    /* ====== OVERLAY MENÚ EMERGENTE ====== */
    .overlay-menu {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: var(--bg-cream); 
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .overlay-menu.active {
      opacity: 1;
      visibility: visible;
    }
    .close-btn {
      position: absolute;
      top: 20px; right: 20px;
      font-size: 2rem;
      color: var(--bg-dark); 
      cursor: pointer;
    }
    .overlay-content {
      display: flex;
      flex-direction: column;
      gap: 30px;
      text-align: center;
    }
    .overlay-content a {
      text-decoration: none;
      color: var(--bg-dark); 
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-style: italic;
      font-weight: 500;
      transition: opacity 0.3s ease;
    }
    .overlay-content a:hover {
      opacity: 0.7;
    }
    /* Estilos extra para iconos del menú */
    .overlay-socials {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-top: 15px;
    }
    .overlay-socials a {
      font-size: 2.2rem;
      color: var(--bg-dark);
    }

    /* ====== MEDIA QUERIES PARA PC ====== */
    @media (min-width: 768px) {
      .page-wrapper {
        max-width: 100%;
        background-color: var(--bg-dark);
        box-shadow: none;
        border: none;
      }
      
      .top-bar { padding: 15px
