<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hello, I'm Natasha</title>
<style>
  /* Importamos fuentes para replicar la tipografía elegante (Serif) y la secundaria (Sans-Serif) */
  @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Lato:wght@300;400&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f6f5f3; /* Color de fondo claro similar a la imagen */
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .poster-container {
    position: relative;
    width: 100%;
    max-width: 550px;
    height: 750px;
    background-color: #f6f5f3;
    overflow: hidden;
    font-family: 'Playfair Display', serif;
    color: #3b3530; /* Tono marrón/gris muy oscuro */
  }

  /* Imagen central */
  .hero-image {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    height: 85%;
    z-index: 1;
    object-fit: cover;
  }

  /* Bloque superior */
  .text-top {
    position: absolute;
    top: 8%;
    left: 0;
    width: 100%;
    text-align: center;
    z-index: 2;
  }

  .text-top .greeting {
    font-size: 2rem;
    font-weight: 400;
    margin-bottom: -15px;
    margin-left: -120px; /* Desplazado ligeramente a la izquierda */
  }

  .text-top .name {
    font-size: 7rem;
    font-weight: 500;
    letter-spacing: -2px;
    line-height: 1;
  }

  /* Bloque lateral derecho */
  .text-side {
    position: absolute;
    top: 29%;
    right: 12%;
    text-align: right;
    font-family: 'Lato', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    line-height: 1.4;
    color: #4a4541;
    z-index: 2;
  }

  /* Bloque inferior */
  .text-bottom {
    position: absolute;
    bottom: 8%;
    width: 100%;
    text-align: center;
    z-index: 2;
  }

  .text-bottom .intro-text {
    font-size: 1.8rem;
    margin-left: -50px;
    margin-bottom: -15px;
    letter-spacing: -0.5px;
  }

  .text-bottom .reintroduce {
    font-size: 5rem;
    font-style: italic;
    font-weight: 400;
    margin-left: 20px;
    line-height: 1;
    letter-spacing: -1px;
  }

  .text-bottom .myself {
    font-size: 2.2rem;
    font-style: italic;
    text-align: right;
    margin-right: 15%;
    margin-top: -15px;
  }
</style>
</head>
<body>

<div class="poster-container">
  <!-- Reemplaza "ruta-de-tu-imagen.png" por la imagen de tu repositorio -->
  <img src="ruta-de-tu-imagen.png" alt="Natasha" class="hero-image">
  
  <div class="text-top">
    <p class="greeting">Hello, I'm</p>
    <h1 class="name">Natasha</h1>
  </div>

  <div class="text-side">
    <p>your business<br>coach for getting<br>consistent clients</p>
  </div>

  <div class="text-bottom">
    <p class="intro-text">If you're new here, let me</p>
    <h2 class="reintroduce">reintroduce</h2>
    <p class="myself">myself</p>
  </div>
</div>

</body>
  </html>
