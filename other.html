<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gisella Villarreal - Branding Social Media</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Se mantiene Playfair Display para títulos e Inter para textos legibles -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'brand-mint': '#A2c2be',
                        'brand-orange': '#eb4600',
                        'brand-cream': '#ffffeb',
                        'brand-dark': '#2c332f', // Tono oscuro necesario para el contraste del texto
                    },
                    fontFamily: {
                        'serif': ['"Playfair Display"', 'serif'],
                        'sans': ['"Inter"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 antialiased text-brand-dark selection:bg-brand-orange selection:text-white">

    <!-- Contenedor estilo BioLink -->
    <main class="max-w-[430px] mx-auto bg-brand-cream min-h-screen relative overflow-hidden shadow-2xl flex flex-col">
        
        <!-- HEADER COMPLETO -->
        <header class="w-full flex flex-col items-center text-center pt-16 pb-8 px-6 relative">
            
            <!-- Detalle decorativo de fondo suave -->
            <div class="absolute top-0 left-0 w-full h-64 bg-gradient-to-b from-brand-mint/30 to-transparent pointer-events-none"></div>

            <!-- Foto de Perfil (Opcional, puedes cambiar la URL) -->
            <div class="relative z-10 w-28 h-28 rounded-full overflow-hidden border-4 border-white shadow-lg mb-5">
                <img src="https://images.unsplash.com/photo-1605405747447-758c0c451556?q=80&w=400&auto=format&fit=crop" 
                     alt="Gisella Villarreal" 
                     class="w-full h-full object-cover">
            </div>
            
            <!-- Título y Subtítulo -->
            <div class="relative z-10 w-full">
                <h1 class="font-serif text-4xl font-semibold mb-1 text-brand-dark tracking-wide">
                    Gisella Villarreal
                </h1>
                <p class="font-sans text-[11px] sm:text-xs font-semibold text-brand-orange uppercase tracking-widest mb-4">
                    Branding Social Media
                </p>
                <p class="font-sans text-sm font-light leading-relaxed text-brand-dark/80 mb-8 px-2">
                    Amo acompañar a marcas personales en la construcción y fortalecimiento de su presencia digital.
                </p>
            </div>

            <!-- Botón CTA Principal -->
            <a href="#" class="relative z-10 flex items-center justify-center gap-2 bg-brand-orange text-white px-8 py-4 rounded-full font-medium text-[15px] hover:bg-opacity-90 hover:-translate-y-0.5 transition-all shadow-lg shadow-brand-orange/30 w-full max-w-[280px] mb-8">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                Hablemos de tu Marca
            </a>

            <!-- Redes Sociales / Botones de Contacto -->
            <div class="relative z-10 flex justify-center gap-5">
                <a href="#" aria-label="WhatsApp" class="w-12 h-12 rounded-full border border-brand-mint/50 bg-white flex items-center justify-center text-brand-dark hover:bg-brand-mint hover:text-white hover:border-brand-mint transition-all shadow-sm">
                    <i class="fa-brands fa-whatsapp text-xl"></i>
                </a>
                <a href="#" aria-label="Instagram" class="w-12 h-12 rounded-full border border-brand-mint/50 bg-white flex items-center justify-center text-brand-dark hover:bg-brand-mint hover:text-white hover:border-brand-mint transition-all shadow-sm">
                    <i class="fa-brands fa-instagram text-xl"></i>
                </a>
                <a href="#" aria-label="LinkedIn" class="w-12 h-12 rounded-full border border-brand-mint/50 bg-white flex items-center justify-center text-brand-dark hover:bg-brand-mint hover:text-white hover:border-brand-mint transition-all shadow-sm">
                    <i class="fa-brands fa-linkedin-in text-xl"></i>
                </a>
                <a href="#" aria-label="Correo" class="w-12 h-12 rounded-full border border-brand-mint/50 bg-white flex items-center justify-center text-brand-dark hover:bg-brand-mint hover:text-white hover:border-brand-mint transition-all shadow-sm">
                    <i class="fa-regular fa-envelope text-xl"></i>
                </a>
            </div>
        </header>

        <!-- SECCIÓN DE ENLACES (Menú) -->
        <section class="relative z-10 px-6 py-2 flex flex-col gap-4 mb-10 flex-grow">
            
            <!-- Botón 1: Servicios -->
            <a href="#" class="group relative w-full h-[4.5rem] rounded-2xl overflow-hidden bg-white shadow-sm hover:shadow-md hover:border-brand-orange transition-all hover:-translate-y-0.5 flex items-center justify-between px-6 border border-brand-mint/30">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center bg-brand-cream text-brand-orange">
                        <i class="fa-solid fa-layer-group text-lg"></i>
                    </div>
                    <span class="font-serif text-[1.1rem] font-medium tracking-wide text-brand-dark group-hover:text-brand-orange transition-colors">Servicios</span>
                </div>
                <i class="fa-solid fa-arrow-right text-brand-mint group-hover:text-brand-orange transition-colors text-sm"></i>
            </a>

            <!-- Botón 2: Trabajos destacados -->
            <a href="#" class="group relative w-full h-[4.5rem] rounded-2xl overflow-hidden bg-white shadow-sm hover:shadow-md hover:border-brand-orange transition-all hover:-translate-y-0.5 flex items-center justify-between px-6 border border-brand-mint/30">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center bg-brand-cream text-brand-orange">
                        <i class="fa-regular fa-star text-lg"></i>
                    </div>
                    <span class="font-serif text-[1.1rem] font-medium tracking-wide text-brand-dark group-hover:text-brand-orange transition-colors">Trabajos destacados</span>
                </div>
                <i class="fa-solid fa-arrow-right text-brand-mint group-hover:text-brand-orange transition-colors text-sm"></i>
            </a>

            <!-- Botón 3: Curso de fotografía -->
            <a href="#" class="group relative w-full h-[4.5rem] rounded-2xl overflow-hidden bg-white shadow-sm hover:shadow-md hover:border-brand-orange transition-all hover:-translate-y-0.5 flex items-center justify-between px-6 border border-brand-mint/30">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-full flex items-center justify-center bg-brand-cream text-brand-orange">
                        <i class="fa-solid fa-mobile-screen-button text-lg"></i>
                    </div>
                    <span class="font-serif text-[1.1rem] font-medium tracking-wide text-brand-dark group-hover:text-brand-orange transition-colors leading-tight">Curso de fotografía<br><span class="font-sans text-[10px] text-brand-mint uppercase tracking-widest font-bold">Con el celular</span></span>
                </div>
                <i class="fa-solid fa-arrow-right text-brand-mint group-hover:text-brand-orange transition-colors text-sm"></i>
            </a>

        </section>

        <!-- FOOTER SIMPLE -->
        <footer class="text-center py-8 border-t border-brand-mint/20 relative z-10">
            <h4 class="font-serif text-2xl font-medium mb-2 text-brand-dark">Gisella Villarreal</h4>
            <p class="text-[10px] font-sans font-semibold text-brand-mint uppercase tracking-widest">
                © 2026 | Todos los derechos reservados
            </p>
        </footer>

    </main>

</body>
  </html>
