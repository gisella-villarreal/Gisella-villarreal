<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitación de Boda - Gis & Roy</title>
    <style>
        /* Importamos fuentes elegantes de Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&family=Lora:ital,wght@0,400;0,600;1,400&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Lora', serif;
            background-color: #ffffff;
        }

        /* --- SECCIÓN 1: HERO (Inicio) --- */
        .hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            background-image: url('dd0cc7469e7b88a430a5e39423e48c3f~2.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
            overflow: hidden;
        }

        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.35); 
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 100px;
        }

        .subtitle {
            font-size: 0.85rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
            opacity: 0.9;
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 4.5rem;
            font-weight: normal;
            margin: 0 0 40px 0;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
        }

        .frame-container {
            position: relative;
            width: 260px;
            height: 360px;
            border-radius: 50%;
            padding: 8px;
            border: 3px dotted rgba(255, 255, 255, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .frame-container::before {
            content: '';
            position: absolute;
            top: -12px; left: -12px; right: -12px; bottom: -12px;
            border-radius: 50%;
            border: 1px dashed rgba(255, 255, 255, 0.6);
        }

        .photo {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-image: url('Simple Minimalist Save the Date Wedding Invitation_20261014_092408_0000.png'); 
            background-size: cover;
            background-position: center;
            border: 6px solid #fdfdfd; 
            box-sizing: border-box;
        }

        .date {
            margin-top: 35px;
            font-size: 1.2rem;
            letter-spacing: 3px;
        }

        .rsvp-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 30px;
            border: 1px solid #ffffff;
            background-color: transparent;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .rsvp-btn:hover {
            background-color: #ffffff;
            color: #333333;
        }

        .lace-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            z-index: 2;
            background-image: radial-gradient(circle at 20px 0, transparent 20px, #ffffff 21px);
            background-size: 40px 100%;
            background-repeat: repeat-x;
            background-position: bottom;
            display: flex;
            justify-content: center;
        }

        .lace-center-detail {
            position: absolute;
            top: -30px;
            width: 80px;
            height: 80px;
            background-color: #ffffff;
            border-radius: 50%;
            z-index: 3;
            background-image: radial-gradient(transparent 40%, rgba(200,200,200,0.3) 45%, transparent 50%);
            background-size: 10px 10px;
        }

        /* --- SECCIÓN 2: HISTORIA DE AMOR --- */
        .love-story {
            background-color: #ffffff;
            /* Se redujo dramáticamente el padding superior e inferior */
            padding: 30px 20px 40px 20px; 
            display: flex;
            justify-content: center;
            text-align: center;
        }

        .story-container {
            max-width: 550px; /* Un poco más estrecho */
            width: 100%;
        }

        .story-subtitle {
            display: block;
            font-size: 0.75rem; /* Más pequeño */
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #a38758; 
            margin-bottom: 10px; /* Menos espacio abajo */
            font-weight: 600;
        }

        .story-title {
            font-size: 2.2rem; /* Título más pequeño */
            color: #4a4a4a; 
            margin: 0 0 15px 0; /* Menos margen */
            font-weight: 600;
            letter-spacing: 1px;
        }

        .story-text {
            font-size: 0.95rem; /* Texto más pequeño */
            line-height: 1.5; /* Menor interlineado */
            color: #666666; 
            margin: 0 0 15px 0; /* Menos espacio entre párrafos */
        }

        .story-divider {
            border: none;
            border-top: 1px solid #d4c4a8; 
            margin: 15px 0; /* Margen reducido a la mitad */
            width: 100%; 
        }

        .initials {
            font-family: 'Great Vibes', cursive;
            font-size: 2.5rem; /* Iniciales más pequeñas */
            color: #a38758; 
            margin-top: 5px; /* Menos margen arriba */
        }

        /* Responsividad para móviles */
        @media (max-width: 600px) {
            .title { font-size: 3.5rem; }
            .frame-container { width: 220px; height: 310px; }
            .date { font-size: 1rem; margin-top: 25px; }
            .rsvp-btn { padding: 8px 25px; font-size: 0.8rem; margin-top: 20px;}
            
            /* Ajustes súper compactos para móviles en la sección 2 */
            .love-story { padding: 25px 15px 30px 15px; }
            .story-subtitle { font-size: 0.7rem; margin-bottom: 8px; }
            .story-title { font-size: 1.8rem; margin-bottom: 12px; }
            .story-text { font-size: 0.85rem; line-height: 1.4; margin-bottom: 12px; }
            .story-divider { margin: 12px 0; }
            .initials { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <!-- SECCIÓN 1: Hero -->
    <section class="hero">
        <div class="content">
            <div class="subtitle">The Wedding Day</div>
            <h1 class="title">Gis & Roy</h1>
            
            <div class="frame-container">
                <div class="photo"></div>
            </div>
            
            <div class="date">17.07.2027</div>
            
            <!-- Botón RSVP -->
            <a href="#" class="rsvp-btn">RSVP NOW</a>
        </div>
        
        <div class="lace-bottom">
            <div class="lace-center-detail"></div>
        </div>
    </section>

    <!-- SECCIÓN 2: Historia de Amor -->
    <section class="love-story">
        <div class="story-container">
            
            <span class="story-subtitle">Con la bendición de Dios</span>
            
            <h2 class="story-title">¡NOS CASAMOS!</h2>
            
            <p class="story-text">
                Nuestra historia de amor fue escrita en el corazón de Dios, guiada por su propósito y bendecida por su gracia.
            </p>
            
            <hr class="story-divider">
            
            <p class="story-text">
                Acompáñanos a celebrar el comienzo de nuestro para siempre.
            </p>
            
            <div class="initials">G+R</div>
            
        </div>
    </section>

</body>
</html>
