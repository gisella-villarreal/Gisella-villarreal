<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gisella Villarreal — Hero Editorial</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --paper-bg: #EAE6DF;
      --ink-color: #2B2825;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--paper-bg);
      overflow-x: hidden;
    }

    /* Fondo completo estilo papel algodón sin espacios vacíos */
    .paper-hero {
      background-color: var(--paper-bg);
      box-shadow: inset 0 0 90px rgba(186, 177, 164, 0.35);
    }

    /* Textura sutil de papel */
    .paper-grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
    }

    /* Sombras orgánicas suaves sobre el papel */
    .floral-shadow {
      background:
        radial-gradient(ellipse at 14% 14%, rgba(120, 112, 102, 0.12) 0%, transparent 48%),
        radial-gradient(ellipse at 86% 12%, rgba(110, 102, 92, 0.11) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 86%, rgba(120, 112, 102, 0.08) 0%, transparent 45%);
    }

    /* Tipografía editorial */
    .brand-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--ink-color);
    }

    .brand-script {
      font-family: 'Pinyon Script', cursive;
      color: var(--ink-color);
    }

    /* Fotografía ovalada suave en blanco y negro */
    .oval-photo-wrapper {
      border-radius: 50%;
      box-shadow:
        inset 0 4px 16px rgba(0, 0, 0, 0.16),
        0 2px 12px rgba(95, 86, 75, 0.12);
    }

    .oval-photo {
      filter: grayscale(100%) contrast(0.93) brightness(1.03);
    }
  </style>
</head>
<body>

  <!-- ==================== HERO EDITORIAL A PANTALLA COMPLETA ==================== -->
  <section id="inicio" class="paper-hero relative min-h-screen w-full flex flex-col items-center justify-center px-6 py-12 sm:py-16 overflow-hidden">

    <!-- Capas de textura y luz suave -->
    <div class="paper-grain absolute inset-0 pointer-events-none z-0"></div>
    <div class="floral-shadow absolute inset-0 pointer-events-none z-0"></div>

    <!-- Encabezado tipográfico: Gisella Villarreal -->
    <header class="relative z-10 text-center mb-10 sm:mb-12 select-none">
      <h1 class="relative inline-flex flex-col items-center leading-none">
        <span class="brand-serif text-3xl sm:text-4xl md:text-[2.85rem] font-normal tracking-[0.07em] uppercase pr-10 sm:pr-14">
          Gisella
        </span>
        <span class="brand-script text-4xl sm:text-5xl md:text-[3.55rem] font-normal -mt-3 sm:-mt-4 pl-14 sm:pl-20">
          Villarreal
        </span>
      </h1>
    </header>

    <!-- Marco ovalado con corona de flores blancas + Fotografía -->
    <div class="relative z-10 w-[72vw] max-w-[330px] sm:max-w-[350px] aspect-[3/3.9] flex items-center justify-center my-2">

      <!-- Corona floral blanca en SVG -->
      <svg
        id="floral-frame"
        viewBox="0 0 460 570"
        class="absolute -inset-[19%] w-[138%] h-[138%] pointer-events-none z-20 overflow-visible"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <defs>
          <!-- Sombra suave y delicada para dar volumen real a los pétalos blancos -->
          <filter id="soft-petal-shadow" x="-25%" y="-25%" width="150%" height="150%">
            <feDropShadow dx="0.8" dy="2.2" stdDeviation="2.4" flood-color="#8C8275" flood-opacity="0.28" />
          </filter>

          <!-- Degradado de pétalo blanco marfil -->
          <radialGradient id="white-petal-grad" cx="50%" cy="28%" r="72%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="68%" stop-color="#FAF8F4" />
            <stop offset="100%" stop-color="#E8E2D9" />
          </radialGradient>

          <!-- Degradado de pétalo interior más luminoso -->
          <radialGradient id="inner-petal-grad" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#EFECE6" />
          </radialGradient>

          <!-- Degradado para hojas blancas/marfil suaves -->
          <linearGradient id="ivory-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="100%" stop-color="#E4DDD3" />
          </linearGradient>
        </defs>

        <!-- Aro delicado base detrás de las flores -->
        <ellipse
          cx="230"
          cy="285"
          rx="168"
          ry="218"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="2"
          opacity="0.85"
        />
        <ellipse
          cx="230"
          cy="285"
          rx="163"
          ry="213"
          fill="none"
          stroke="#D6CFC4"
          stroke-width="0.9"
          opacity="0.7"
        />

        <!-- Capas donde se dibujan hojas, flores medianas y flores principales -->
        <g id="wreath-leaves" filter="url(#soft-petal-shadow)"></g>
        <g id="wreath-flowers" filter="url(#soft-petal-shadow)"></g>
      </svg>

      <!-- Retrato recortado en óvalo -->
      <div class="oval-photo-wrapper relative z-10 w-full h-full overflow-hidden bg-[#D5CFC6]">
        <img
          src="https://images.unsplash.com/photo-1594552072238-b8a33785b261?auto=format&fit=crop&w=900&q=80"
          alt="Gisella Villarreal — Identidad visual para bodas"
          class="oval-photo w-full h-full object-cover object-center"
        />
      </div>
    </div>

  </section>

  <!-- Script que dibuja la corona estética de flores blancas alrededor del óvalo -->
  <script>
    (function buildWhiteFloralWreath() {
      const ns = 'http://www.w3.org/2000/svg';
      const leavesGroup = document.getElementById('wreath-leaves');
      const flowersGroup = document.getElementById('wreath-flowers');

      const cx = 230;
      const cy = 285;
      const rx = 174;
      const ry = 224;

      // Helper para crear elementos SVG
      function el(tag, attrs = {}) {
        const node = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) {
          node.setAttribute(k, v);
        }
        return node;
      }

      // Dibuja una hoja botánica blanca/marfil
      function createLeaf(x, y, angleDeg, scale = 1) {
        const g = el('g', {
          transform: `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${angleDeg.toFixed(1)}) scale(${scale.toFixed(2)})`
        });
        g.appendChild(el('path', {
          d: 'M 0,0 C -6,-8 -5,-21 0,-29 C 5,-21 6,-8 0,0 Z',
          fill: 'url(#ivory-leaf-grad)',
          stroke: '#FFFFFF',
          'stroke-width': '0.6'
        }));
        g.appendChild(el('path', {
          d: 'M 0,-2 L 0,-23',
          stroke: '#DCD5CA',
          'stroke-width': '0.7',
          'stroke-linecap': 'round'
        }));
        return g;
      }

      // Dibuja una flor blanca editorial de doble capa (tipo anémona / rosa de jardín)
      function createWhiteFlower(x, y, scale = 1, rotOffset = 0, isLarge = true) {
        const g = el('g', {
          transform: `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${rotOffset.toFixed(1)}) scale(${scale.toFixed(2)})`
        });

        const petals = 5;
        // Capa exterior de pétalos
        for (let i = 0; i < petals; i++) {
          const deg = (360 / petals) * i;
          g.appendChild(el('path', {
            d: 'M 0,0 C -9,-5 -12,-18 0,-23 C 12,-18 9,-5 0,0 Z',
            fill: 'url(#white-petal-grad)',
            stroke: '#E6E0D6',
            'stroke-width': '0.5',
            transform: `rotate(${deg})`
          }));
        }

        // Segunda capa de pétalos más pequeños (para flores principales)
        if (isLarge) {
          for (let i = 0; i < petals; i++) {
            const deg = (360 / petals) * i + 36;
            g.appendChild(el('path', {
              d: 'M 0,0 C -6,-3 -8,-12 0,-15 C 8,-12 6,-3 0,0 Z',
              fill: 'url(#inner-petal-grad)',
              stroke: '#ECE7DF',
              'stroke-width': '0.45',
              transform: `rotate(${deg})`
            }));
          }
        }

        // Centro sutil en tono champagne pálido / marfil
        g.appendChild(el('circle', {
          cx: '0',
          cy: '0',
          r: isLarge ? '3.3' : '2.3',
          fill: '#DDD4C6'
        }));
        g.appendChild(el('circle', {
          cx: '0',
          cy: '0',
          r: isLarge ? '1.6' : '1.1',
          fill: '#F7F3EC'
        }));

        return g;
      }

      // 1. Hojas delicadas siguiendo la curva del óvalo
      const leafCount = 34;
      for (let i = 0; i < leafCount; i++) {
        const t = (i / leafCount) * Math.PI * 2;
        const offset = (i % 2 === 0 ? 5 : -3);
        const x = cx + (rx + offset) * Math.cos(t);
        const y = cy + (ry + offset) * Math.sin(t);
        const tangentDeg = (t * 180) / Math.PI + 90 + (i % 2 === 0 ? 28 : -28);
        const scale = 0.72 + (i % 3) * 0.14;
        leavesGroup.appendChild(createLeaf(x, y, tangentDeg, scale));
      }

      // 2. Flores blancas alternando tamaños y ángulos orgánicos
      const flowerCount = 22;
      for (let i = 0; i < flowerCount; i++) {
        const t = (i / flowerCount) * Math.PI * 2;
        const isLarge = i % 2 === 0;
        const radialShift = isLarge ? 2 : -4;
        const x = cx + (rx + radialShift) * Math.cos(t);
        const y = cy + (ry + radialShift) * Math.sin(t);
        const scale = isLarge ? (0.86 + (i % 3) * 0.08) : (0.58 + (i % 2) * 0.1);
        const rot = (i * 37) % 360;

        flowersGroup.appendChild(createWhiteFlower(x, y, scale, rot, isLarge));
      }

      // 3. Pequeños capullos blancos intercalados para dar acabado delicado
      const budCount = 16;
      for (let i = 0; i < budCount; i++) {
        const t = ((i + 0.5) / budCount) * Math.PI * 2;
        const radialShift = i % 2 === 0 ? 11 : -9;
        const x = cx + (rx + radialShift) * Math.cos(t);
        const y = cy + (ry + radialShift) * Math.sin(t);

        const bud = el('g', {
          transform: `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${((i * 53) % 360)})`
        });
        for (let p = 0; p < 4; p++) {
          bud.appendChild(el('ellipse', {
            cx: '0',
            cy: '-3.5',
            rx: '2.6',
            ry: '4.2',
            fill: '#FFFFFF',
            stroke: '#E9E3DA',
            'stroke-width': '0.4',
            transform: `rotate(${p * 90})`
          }));
        }
        bud.appendChild(el('circle', { cx: '0', cy: '0', r: '1.3', fill: '#DFD6C8' }));
        flowersGroup.appendChild(bud);
      }
    })();
  </script>
</body>
</html>
