<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gisella Villarreal — Hero Editorial</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --paper-bg: #EAE6DF;
      --ink-color: #2B2825;
    }

    body {
      margin: 0;
      background-color: #1A1918;
      overflow-x: hidden;
    }

    /* Fondo exterior difuminado en blanco y negro */
    .hero-backdrop {
      background-image:
        linear-gradient(rgba(18, 17, 16, 0.25), rgba(18, 17, 16, 0.38)),
        url('https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&w=1600&q=80');
      background-size: cover;
      background-position: center;
      filter: grayscale(100%) blur(6px) contrast(1.08);
      transform: scale(1.08);
    }

    /* Tarjeta estilo papel algodón */
    .paper-card {
      background-color: var(--paper-bg);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.45),
        inset 0 0 60px rgba(196, 188, 176, 0.35);
    }

    /* Textura sutil de papel */
    .paper-grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
    }

    /* Sombra floral suave sobre el papel */
    .floral-shadow {
      background:
        radial-gradient(ellipse at 12% 16%, rgba(120, 112, 102, 0.14) 0%, transparent 52%),
        radial-gradient(ellipse at 85% 12%, rgba(110, 102, 92, 0.13) 0%, transparent 48%),
        radial-gradient(ellipse at 88% 84%, rgba(120, 112, 102, 0.08) 0%, transparent 45%);
    }

    /* Tipografía editorial */
    .brand-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--ink-color);
    }

    .brand-script {
      font-family: 'Pinyon Script', cursive;
      color: var(--ink-color);
    }

    /* Fotografía ovalada suave en B&N */
    .oval-photo-wrapper {
      border-radius: 50%;
      box-shadow:
        inset 0 4px 14px rgba(0, 0, 0, 0.18),
        0 1px 0 rgba(255, 255, 255, 0.85);
    }

    .oval-photo {
      filter: grayscale(100%) contrast(0.92) brightness(1.03);
    }
  </style>
</head>
<body>

  <!-- ==================== HERO EDITORIAL ==================== -->
  <section id="inicio" class="relative min-h-screen w-full flex items-center justify-center px-5 py-8 sm:px-10 sm:py-12 overflow-hidden">

    <!-- Imagen de fondo difuminada -->
    <div class="hero-backdrop absolute inset-0 z-0" aria-hidden="true"></div>

    <!-- Tarjeta central de papel -->
    <div class="paper-card relative z-10 w-full max-w-[540px] min-h-[78vh] sm:min-h-[82vh] flex flex-col items-center justify-center px-6 py-12 sm:px-12 sm:py-14 overflow-hidden">

      <!-- Capas de textura y sombra orgánica -->
      <div class="paper-grain absolute inset-0 pointer-events-none z-0"></div>
      <div class="floral-shadow absolute inset-0 pointer-events-none z-0"></div>

      <!-- Encabezado tipográfico: Gisella Villarreal -->
      <header class="relative z-10 text-center mb-8 sm:mb-10 select-none">
        <h1 class="relative inline-flex flex-col items-center leading-none">
          <span class="brand-serif text-3xl sm:text-4xl md:text-[2.65rem] font-normal tracking-[0.06em] uppercase pr-10 sm:pr-14">
            Gisella
          </span>
          <span class="brand-script text-4xl sm:text-5xl md:text-[3.35rem] font-normal -mt-3 sm:-mt-4 pl-14 sm:pl-20">
            Villarreal
          </span>
        </h1>
      </header>

      <!-- Marco ovalado en relieve + Fotografía -->
      <div class="relative z-10 w-[76%] max-w-[330px] aspect-[3/3.9] flex items-center justify-center my-2">

        <!-- Marco ornamental SVG con efecto de papel en relieve (letterpress) -->
        <svg
          id="embossed-frame"
          viewBox="0 0 420 530"
          class="absolute -inset-[17%] w-[134%] h-[134%] pointer-events-none z-20"
          xmlns="http://www.w3.org/2000/svg"
          aria-hidden="true"
        >
          <defs>
            <!-- Filtro que simula relieve blanco sobre papel -->
            <filter id="paper-emboss" x="-15%" y="-15%" width="130%" height="130%">
              <feDropShadow dx="-1.2" dy="-1.2" stdDeviation="1" flood-color="#FFFFFF" flood-opacity="0.92" result="light" />
              <feDropShadow dx="1.6" dy="1.8" stdDeviation="1.6" flood-color="#ACA498" flood-opacity="0.65" result="shadow" />
              <feMerge>
                <feMergeNode in="shadow" />
                <feMergeNode in="light" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>

          <!-- Grupo donde se dibujan las ondas barrocas en relieve -->
          <g id="frame-ornaments" filter="url(#paper-emboss)"></g>

          <!-- Aro interior liso en relieve -->
          <ellipse
            cx="210"
            cy="265"
            rx="156"
            ry="205"
            fill="none"
            stroke="#EFECE6"
            stroke-width="6"
            filter="url(#paper-emboss)"
          />
          <ellipse
            cx="210"
            cy="265"
            rx="149"
            ry="198"
            fill="none"
            stroke="#DCD6CC"
            stroke-width="1.2"
          />
        </svg>

        <!-- Retrato recortado en óvalo -->
        <div class="oval-photo-wrapper relative z-10 w-full h-full overflow-hidden bg-[#D5CFC6]">
          <img
            src="https://images.unsplash.com/photo-1594552072238-b8a33785b261?auto=format&fit=crop&w=900&q=80"
            alt="Gisella Villarreal — Identidad visual para bodas"
            class="oval-photo w-full h-full object-cover object-center"
          />
        </div>
      </div>

    </div>
  </section>

  <!-- Script que genera el borde ornamental simétrico en relieve -->
  <script>
    (function buildEmbossedOval() {
      const container = document.getElementById('frame-ornaments');
      const ns = 'http://www.w3.org/2000/svg';
      const cx = 210;
      const cy = 265;
      const rx = 176;
      const ry = 225;
      const count = 28; // Número de motivos florales alrededor del óvalo

      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const x = cx + rx * Math.cos(angle);
        const y = cy + ry * Math.sin(angle);
        const deg = (angle * 180) / Math.PI + 90;

        const g = document.createElementNS(ns, 'g');
        g.setAttribute('transform', `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${deg.toFixed(1)})`);

        // Motivo de concha/pétalo estilo rococó en relieve
        const petal = document.createElementNS(ns, 'path');
        petal.setAttribute(
          'd',
          'M -18,6 C -20,-8 -10,-16 0,-18 C 10,-16 20,-8 18,6 C 12,12 -12,12 -18,6 Z'
        );
        petal.setAttribute('fill', '#ECE8E1');
        petal.setAttribute('stroke', '#F7F5F0');
        petal.setAttribute('stroke-width', '1.4');

        // Detalle interior del relieve
        const innerCurl = document.createElementNS(ns, 'path');
        innerCurl.setAttribute(
          'd',
          'M -9,3 C -9,-5 -4,-10 0,-11 C 4,-10 9,-5 9,3'
        );
        innerCurl.setAttribute('fill', 'none');
        innerCurl.setAttribute('stroke', '#DCD6CC');
        innerCurl.setAttribute('stroke-width', '1.3');
        innerCurl.setAttribute('stroke-linecap', 'round');

        // Perla pequeña en relieve entre motivos
        const dot = document.createElementNS(ns, 'circle');
        dot.setAttribute('cx', '0');
        dot.setAttribute('cy', '-2');
        dot.setAttribute('r', '2.3');
        dot.setAttribute('fill', '#F4F1EC');

        g.appendChild(petal);
        g.appendChild(innerCurl);
        g.appendChild(dot);
        container.appendChild(g);
      }
    })();
  </script>
</body>
</html>
