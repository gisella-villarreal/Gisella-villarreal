<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gisella Villarreal — Hero Editorial</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Pinyon+Script&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {
      --paper-bg: #EAE6DF;
      --ink-color: #2B2825;
    }

    html, body {
      margin: 0;
      padding: 0;
      background-color: var(--paper-bg);
      overflow-x: hidden;
    }

    /* Fondo completo estilo papel algodón sin espacios vacíos */
    .paper-hero {
      background-color: var(--paper-bg);
      box-shadow: inset 0 0 90px rgba(186, 177, 164, 0.35);
    }

    /* Textura sutil de papel */
    .paper-grain {
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.055'/%3E%3C/svg%3E");
    }

    /* Sombras orgánicas suaves sobre el papel */
    .floral-shadow {
      background:
        radial-gradient(ellipse at 14% 14%, rgba(120, 112, 102, 0.11) 0%, transparent 48%),
        radial-gradient(ellipse at 86% 12%, rgba(110, 102, 92, 0.10) 0%, transparent 45%),
        radial-gradient(ellipse at 85% 86%, rgba(120, 112, 102, 0.08) 0%, transparent 45%);
    }

    /* Tipografía editorial */
    .brand-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
      color: var(--ink-color);
    }

    .brand-script {
      font-family: 'Pinyon Script', cursive;
      color: var(--ink-color);
    }

    /* Fotografía ovalada suave en blanco y negro */
    .oval-photo-wrapper {
      border-radius: 50%;
      box-shadow:
        inset 0 4px 16px rgba(0, 0, 0, 0.16),
        0 2px 14px rgba(95, 86, 75, 0.12);
    }

    .oval-photo {
      filter: grayscale(100%) contrast(0.93) brightness(1.03);
    }
  </style>
</head>
<body>

  <!-- ==================== HERO EDITORIAL A PANTALLA COMPLETA ==================== -->
  <section id="inicio" class="paper-hero relative min-h-screen w-full flex flex-col items-center justify-start pt-5 sm:pt-7 pb-14 px-6 overflow-hidden">

    <!-- Capas de textura y luz suave -->
    <div class="paper-grain absolute inset-0 pointer-events-none z-0"></div>
    <div class="floral-shadow absolute inset-0 pointer-events-none z-0"></div>

    <!-- Encabezado tipográfico pegado a la parte superior: Gisella Villarreal -->
    <header class="relative z-10 text-center mb-10 sm:mb-12 select-none">
      <h1 class="relative inline-flex flex-col items-center leading-none">
        <span class="brand-serif text-3xl sm:text-4xl md:text-[2.85rem] font-normal tracking-[0.07em] uppercase pr-10 sm:pr-14">
          Gisella
        </span>
        <span class="brand-script text-4xl sm:text-5xl md:text-[3.55rem] font-normal -mt-3 sm:-mt-4 pl-14 sm:pl-20">
          Villarreal
        </span>
      </h1>
    </header>

    <!-- Marco ovalado de rosas blancas delicadas + Fotografía -->
    <div class="relative z-10 w-[72vw] max-w-[330px] sm:max-w-[355px] aspect-[3/3.9] flex items-center justify-center my-auto">

      <!-- Marco de rosas blancas en SVG -->
      <svg
        id="roses-frame"
        viewBox="0 0 480 590"
        class="absolute -inset-[20%] w-[140%] h-[140%] pointer-events-none z-20 overflow-visible"
        xmlns="http://www.w3.org/2000/svg"
        aria-hidden="true"
      >
        <defs>
          <!-- Sombra suave para dar volumen real a cada rosa -->
          <filter id="rose-shadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0.8" dy="2.4" stdDeviation="2.6" flood-color="#877D70" flood-opacity="0.30" />
          </filter>

          <!-- Sombra muy sutil interna para pétalos -->
          <filter id="petal-soft" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1" stdDeviation="1.1" flood-color="#9A9083" flood-opacity="0.22" />
          </filter>

          <!-- Degradado de pétalo exterior de rosa blanca -->
          <radialGradient id="rose-outer-petal" cx="45%" cy="25%" r="78%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="65%" stop-color="#FAF8F4" />
            <stop offset="100%" stop-color="#E4DDD3" />
          </radialGradient>

          <!-- Degradado de pétalo intermedio -->
          <radialGradient id="rose-mid-petal" cx="50%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#FFFFFF" />
            <stop offset="72%" stop-color="#F6F3ED" />
            <stop offset="100%" stop-color="#DDD5CA" />
          </radialGradient>

          <!-- Degradado del corazón de la rosa (blanco cremoso) -->
          <radialGradient id="rose-core" cx="50%" cy="45%" r="65%">
            <stop offset="0%" stop-color="#ECE5DA" />
            <stop offset="55%" stop-color="#F7F4EE" />
            <stop offset="100%" stop-color="#FFFFFF" />
          </radialGradient>

          <!-- Degradado para hojas delicadas en tono marfil perla -->
          <linearGradient id="rose-leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#FBF9F6" />
            <stop offset="60%" stop-color="#EAE4DB" />
            <stop offset="100%" stop-color="#D8D0C4" />
          </linearGradient>
        </defs>

        <!-- Doble línea ovalada fina de soporte -->
        <ellipse
          cx="240"
          cy="295"
          rx="174"
          ry="226"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.8"
          opacity="0.85"
        />
        <ellipse
          cx="240"
          cy="295"
          rx="168"
          ry="220"
          fill="none"
          stroke="#D3CBBF"
          stroke-width="0.9"
          opacity="0.75"
        />

        <!-- Capas de hojas, capullos y rosas -->
        <g id="roses-leaves" filter="url(#rose-shadow)"></g>
        <g id="roses-buds" filter="url(#rose-shadow)"></g>
        <g id="roses-blooms" filter="url(#rose-shadow)"></g>
      </svg>

      <!-- Retrato recortado en óvalo -->
      <div class="oval-photo-wrapper relative z-10 w-full h-full overflow-hidden bg-[#D5CFC6]">
        <img
          src="https://images.unsplash.com/photo-1594552072238-b8a33785b261?auto=format&fit=crop&w=900&q=80"
          alt="Gisella Villarreal — Identidad visual para bodas"
          class="oval-photo w-full h-full object-cover object-center"
        />
      </div>
    </div>

  </section>

  <!-- Script que dibuja el marco de rosas blancas delicadas -->
  <script>
    (function buildWhiteRosesFrame() {
      const ns = 'http://www.w3.org/2000/svg';
      const leavesLayer = document.getElementById('roses-leaves');
      const budsLayer = document.getElementById('roses-buds');
      const bloomsLayer = document.getElementById('roses-blooms');

      const cx = 240;
      const cy = 295;
      const rx = 176;
      const ry = 228;

      function el(tag, attrs = {}) {
        const node = document.createElementNS(ns, tag);
        for (const [k, v] of Object.entries(attrs)) {
          node.setAttribute(k, v);
        }
        return node;
      }

      // Hoja delicada de rosal
      function createRoseLeaf(x, y, angleDeg, scale = 1) {
        const g = el('g', {
          transform: `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${angleDeg.toFixed(1)}) scale(${scale.toFixed(2)})`
        });
        g.appendChild(el('path', {
          d: 'M 0,0 C -7,-7 -8,-19 0,-28 C 8,-19 7,-7 0,0 Z',
          fill: 'url(#rose-leaf-grad)',
          stroke: '#FFFFFF',
          'stroke-width': '0.6'
        }));
        g.appendChild(el('path', {
          d: 'M 0,-2 L 0,-22',
          stroke: '#CFC6B8',
          'stroke-width': '0.65',
          'stroke-linecap': 'round'
        }));
        return g;
      }

      // Capullo delicado de rosa blanca
      function createRoseBud(x, y, angleDeg, scale = 1) {
        const g = el('g', {
          transform: `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${angleDeg.toFixed(1)}) scale(${scale.toFixed(2)})`
        });
        // Pétalos laterales envolventes
        g.appendChild(el('path', {
          d: 'M -5,4 C -10,-3 -8,-13 -1,-16 C 3,-10 2,0 -5,4 Z',
          fill: 'url(#rose-outer-petal)',
          stroke: '#DDD6CB',
          'stroke-width': '0.5'
        }));
        g.appendChild(el('path', {
          d: 'M 5,4 C 10,-3 8,-13 1,-16 C -3,-10 -2,0 5,4 Z',
          fill: 'url(#rose-outer-petal)',
          stroke: '#DDD6CB',
          'stroke-width': '0.5'
        }));
        // Pétalo central cerrado
        g.appendChild(el('path', {
          d: 'M 0,5 C -6,2 -6,-10 0,-15 C 6,-10 6,2 0,5 Z',
          fill: 'url(#rose-mid-petal)',
          stroke: '#FFFFFF',
          'stroke-width': '0.6'
        }));
        // Base del cáliz
        g.appendChild(el('path', {
          d: 'M -4,4 Q 0,8 4,4',
          fill: 'none',
          stroke: '#D2C9BC',
          'stroke-width': '1.2',
          'stroke-linecap': 'round'
        }));
        return g;
      }

      // Rosa blanca de jardín con capas de pétalos suaves en espiral
      function createWhiteRose(x, y, scale = 1, rotDeg = 0) {
        const g = el('g', {
          transform: `translate(${x.toFixed(1)}, ${y.toFixed(1)}) rotate(${rotDeg.toFixed(1)}) scale(${scale.toFixed(2)})`
        });

        // 1. Capa exterior: 5 pétalos anchos y redondeados
        for (let i = 0; i < 5; i++) {
          const a = i * 72;
          g.appendChild(el('path', {
            d: 'M -12,-3 C -16,-14 -7,-22 0,-21 C 7,-22 16,-14 12,-3 C 8,3 -8,3 -12,-3 Z',
            fill: 'url(#rose-outer-petal)',
            stroke: '#DFD8CE',
            'stroke-width': '0.55',
            transform: `rotate(${a})`
          }));
        }

        // 2. Segunda capa: 5 pétalos ligeramente más cerrados y rotados
        for (let i = 0; i < 5; i++) {
          const a = i * 72 + 34;
          g.appendChild(el('path', {
            d: 'M -9,-2 C -12,-10 -5,-16 0,-15.5 C 5,-16 12,-10 9,-2 C 5,2 -5,2 -9,-2 Z',
            fill: 'url(#rose-mid-petal)',
            stroke: '#E4DDD3',
            'stroke-width': '0.5',
            filter: 'url(#petal-soft)',
            transform: `rotate(${a})`
          }));
        }

        // 3. Tercera capa: 4 pétalos en copa abrazando el centro
        for (let i = 0; i < 4; i++) {
          const a = i * 90 + 18;
          g.appendChild(el('path', {
            d: 'M -6.5,-1 C -8,-7 -3,-11.5 0,-11 C 3,-11.5 8,-7 6.5,-1 C 3.5,2 -3.5,2 -6.5,-1 Z',
            fill: 'url(#rose-outer-petal)',
            stroke: '#DDD5C9',
            'stroke-width': '0.5',
            transform: `rotate(${a})`
          }));
        }

        // 4. Centro de la rosa con espiral delicada
        g.appendChild(el('circle', {
          cx: '0',
          cy: '0',
          r: '6.2',
          fill: 'url(#rose-core)',
          stroke: '#E5DFD6',
          'stroke-width': '0.5'
        }));

        // Curvas internas que forman el remolino de pétalos
        g.appendChild(el('path', {
          d: 'M -3.5,-1.5 C -4,-4.5 1,-5.5 3.5,-2.5 C 5,0.5 2.5,4.2 -1,3.8 C -3.2,3.5 -3.8,0.5 -1.8,-0.8 C -0.4,-1.8 1.6,-1.2 1.5,0.5 C 1.4,1.6 0,2 -0.8,1.2',
          fill: 'none',
          stroke: '#CFC6B8',
          'stroke-width': '0.85',
          'stroke-linecap': 'round'
        }));

        return g;
      }

      // 1. Hojas delicadas siguiendo el óvalo
      const leafCount = 32;
      for (let i = 0; i < leafCount; i++) {
        const t = (i / leafCount) * Math.PI * 2;
        const radialOffset = i % 2 === 0 ? 7 : -5;
        const x = cx + (rx + radialOffset) * Math.cos(t);
        const y = cy + (ry + radialOffset) * Math.sin(t);
        const angle = (t * 180) / Math.PI + 90 + (i % 2 === 0 ? 32 : -32);
        const scale = 0.72 + (i % 3) * 0.12;
        leavesLayer.appendChild(createRoseLeaf(x, y, angle, scale));
      }

      // 2. Capullos intercalados suavemente en el borde exterior
      const budCount = 18;
      for (let i = 0; i < budCount; i++) {
        const t = ((i + 0.5) / budCount) * Math.PI * 2;
        const radialOffset = i % 2 === 0 ? 11 : -7;
        const x = cx + (rx + radialOffset) * Math.cos(t);
        const y = cy + (ry + radialOffset) * Math.sin(t);
        const angle = (t * 180) / Math.PI + 90 + (i % 2 === 0 ? 18 : -18);
        budsLayer.appendChild(createRoseBud(x, y, angle, 0.85));
      }

      // 3. Rosas blancas principales y medianas alrededor de todo el marco
      const roseCount = 24;
      for (let i = 0; i < roseCount; i++) {
        const t = (i / roseCount) * Math.PI * 2;
        const isMain = i % 2 === 0;
        const radialOffset = isMain ? 1 : -3;
        const x = cx + (rx + radialOffset) * Math.cos(t);
        const y = cy + (ry + radialOffset) * Math.sin(t);
        const scale = isMain ? (0.88 + (i % 3) * 0.08) : (0.64 + (i % 2) * 0.08);
        const rot = (i * 41) % 360;
        bloomsLayer.appendChild(createWhiteRose(x, y, scale, rot));
      }
    })();
  </script>
</body>
</html>
