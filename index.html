<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gisella Villarreal | Diseño Web & Experiencias Digitales</title>
  
  <!-- Tipografías de alta gama -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
  
  <!-- Iconografía Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-cream: #F7F4EE;
      --bg-card: #FFFFFF;
      --bg-secondary: #EFECE4;
      --bg-dark: #141414;
      --text-main: #141414;
      --text-muted: #6B6760;
      --text-light: #9C978F;
      --border-color: #E4E0D6;
      --border-dark: #2A2A2A;
      --accent-silver: #D4D0C7;
      --transition-smooth: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      scroll-behavior: smooth;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* ENCABEZADO FIJO */
    .site-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: rgba(247, 244, 238, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      z-index: 1000;
      height: 70px;
      display: flex;
      align-items: center;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-style: italic;
      font-weight: 500;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.3px;
    }

    .menu-toggle-btn {
      background: transparent;
      border: none;
      font-size: 1.7rem;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 8px;
      transition: var(--transition-smooth);
    }

    .menu-toggle-btn:hover {
      background-color: var(--bg-secondary);
    }

    /* MENÚ OVERLAY MODAL */
    .overlay-menu {
      position: fixed;
      inset: 0;
      background-color: var(--bg-cream);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 25px 40px;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-10px);
      transition: var(--transition-smooth);
    }

    .overlay-menu.active {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .overlay-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .close-menu-btn {
      background: transparent;
      border: none;
      font-size: 2rem;
      color: var(--text-main);
      cursor: pointer;
    }

    .overlay-nav {
      display: flex;
      flex-direction: column;
      gap: 18px;
      margin: auto 0;
      text-align: left;
    }

    .overlay-nav a {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-style: italic;
      color: var(--text-main);
      text-decoration: none;
      transition: var(--transition-smooth);
      display: inline-block;
      letter-spacing: -0.5px;
    }

    .overlay-nav a:hover {
      color: var(--text-muted);
      transform: translateX(8px);
    }

    .overlay-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* HERO */
    .hero-section {
      padding-top: 110px;
      padding-bottom: 40px;
    }

    .hero-badge-wrap {
      margin-bottom: 25px;
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: transparent;
      border: 1px solid var(--border-color);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-main);
    }

    .badge-pill span {
      background: var(--bg-dark);
      color: white;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: 3.4rem;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -1.2px;
      margin-bottom: 22px;
      color: var(--text-main);
    }

    .hero-title i {
      font-weight: 400;
      font-style: italic;
      color: var(--text-muted);
    }

    .hero-lead {
      font-size: 0.95rem;
      color: var(--text-muted);
      line-height: 1.65;
      margin-bottom: 30px;
      max-width: 580px;
    }

    .hero-lead i {
      color: var(--text-main);
      font-weight: 500;
    }

    .hero-buttons {
      display: flex;
      gap: 16px;
      margin-bottom: 35px;
      flex-wrap: wrap;
    }

    .btn-solid-dark {
      background: var(--bg-dark);
      color: #FFFFFF;
      padding: 13px 26px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition-smooth);
    }

    .btn-solid-dark:hover {
      background-color: #262626;
      transform: translateY(-2px);
    }

    .btn-link-action {
      background: transparent;
      color: var(--text-main);
      padding: 13px 4px;
      font-size: 0.82rem;
      font-weight: 600;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition-smooth);
    }

    .btn-link-action:hover {
      color: var(--text-muted);
    }

    .hero-photo-wrapper {
      width: 100%;
      height: 480px;
      border-radius: 14px;
      overflow: hidden;
      background-color: var(--bg-secondary);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .hero-photo-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 25%;
    }

    .hero-social-block {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      padding: 22px 0 10px;
    }

    .hero-social-block span {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      color: var(--text-muted);
    }

    .social-icon-link {
      color: var(--text-main);
      font-size: 1.45rem;
      text-decoration: none !important;
      display: flex;
      align-items: center;
      transition: var(--transition-smooth);
    }

    .social-icon-link:hover {
      color: var(--text-muted);
      transform: scale(1.15);
    }

    /* FRANJA DE CONFIANZA */
    .trust-strip {
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
      padding: 30px 20px;
      margin: 30px 0 50px;
    }

    .trust-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    .trust-card {
      background: var(--bg-cream);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 22px 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: var(--transition-smooth);
    }

    .trust-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
    }

    .trust-emoji {
      font-size: 1.8rem;
      line-height: 1;
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      background: var(--bg-card);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
    }

    .trust-info h3 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 3px;
    }

    .trust-info p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* SECCIÓN DE SERVICIOS */
    .section-spacing {
      padding: 50px 0;
    }

    .section-head {
      margin-bottom: 35px;
      text-align: center;
    }

    .section-eyebrow {
      font-family: 'Inter', sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1.8px;
      text-transform: uppercase;
      color: var(--text-light);
      display: block;
      margin-bottom: 6px;
    }

    .section-headline {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 500;
      line-height: 1.1;
      letter-spacing: -0.8px;
      color: var(--text-main);
    }

    .section-headline i {
      font-style: italic;
      color: var(--text-muted);
    }

    .services-stack {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .service-row-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: var(--transition-smooth);
    }

    .service-row-card:hover {
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04);
      border-color: #D6D0C2;
    }

    .service-img-wrapper {
      width: 100%;
      height: 240px;
      overflow: hidden;
      background-color: var(--bg-secondary);
      position: relative;
    }

    .service-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition-smooth);
    }

    .service-row-card:hover .service-img-wrapper img {
      transform: scale(1.04);
    }

    .service-content {
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .service-tag {
      font-size: 0.65rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-light);
      margin-bottom: 8px;
    }

    .service-name {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .service-desc {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 12px;
    }

    .service-ideal {
      font-size: 0.78rem;
      color: var(--text-light);
      font-style: italic;
      margin-bottom: 22px;
      line-height: 1.45;
    }

    .service-cta-link {
      align-self: flex-start;
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding-bottom: 3px;
      border-bottom: 1.5px solid var(--text-main);
      transition: var(--transition-smooth);
    }

    .service-cta-link:hover {
      color: var(--text-muted);
      border-color: var(--text-muted);
      gap: 10px;
    }

    /* PORTAFOLIO */
    .portfolio-tabs {
      display: flex;
      justify-content: flex-start;
      gap: 8px;
      margin-bottom: 30px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 6px;
    }
    .portfolio-tabs::-webkit-scrollbar { display: none; }

    .tab-btn {
      background: transparent;
      border: 1px solid var(--border-color);
      padding: 9px 18px;
      border-radius: 999px;
      font-family: 'Inter', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      white-space: nowrap;
      cursor: pointer;
      transition: var(--transition-smooth);
    }

    .tab-btn.active {
      background: var(--bg-dark);
      color: #FFFFFF;
      border-color: var(--bg-dark);
    }

    .portfolio-gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    .project-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: var(--transition-smooth);
    }

    .project-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.05);
    }

    .project-thumbnail {
      width: 100%;
      aspect-ratio: 1 / 1;
      overflow: hidden;
      background-color: var(--bg-secondary);
      position: relative;
    }

    .project-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: var(--transition-smooth);
    }

    .project-card:hover .project-thumbnail img {
      transform: scale(1.06);
    }

    .project-meta {
      padding: 14px 12px;
    }

    .project-cat-badge {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-light);
      display: block;
      margin-bottom: 3px;
    }

    .project-heading {
      font-family: 'Playfair Display', serif;
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.25;
      color: var(--text-main);
    }

    /* ASÍ TRABAJO CONTIGO (2 CUADROS / 2 COLUMNAS) */
    .how-we-work-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .work-step-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 26px 22px;
      position: relative;
      transition: var(--transition-smooth);
    }

    .work-step-card:hover {
      border-color: #CDC7B9;
      box-shadow: 0 6px 18px rgba(0,0,0,0.03);
    }

    .step-number {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-style: italic;
      color: var(--text-light);
      line-height: 1;
      margin-bottom: 12px;
    }

    .step-title {
      font-size: 1.05rem;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .step-desc {
      font-size: 0.82rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    /* SOBRE MÍ */
    .about-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      padding: 26px 22px;
    }

    .about-image-frame {
      width: 100%;
      height: 380px;
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 25px;
      border: 1px solid var(--border-color);
    }

    .about-image-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
    }

    .about-greeting {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      line-height: 1.15;
      margin-bottom: 18px;
    }

    .about-paragraphs p {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.7;
      margin-bottom: 16px;
    }

    .about-paragraphs p:last-child {
      margin-bottom: 0;
      font-weight: 500;
      color: var(--text-main);
      font-style: italic;
    }

    /* TESTIMONIOS */
    .testimonials-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .testimonial-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 26px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .quote-icon {
      font-size: 1.6rem;
      color: var(--text-light);
      margin-bottom: 12px;
    }

    .testimonial-quote {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      font-style: italic;
      color: var(--text-main);
      line-height: 1.55;
      margin-bottom: 20px;
    }

    .client-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .client-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: var(--bg-secondary);
      object-fit: cover;
    }

    .client-details h4 {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .client-details span {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    /* PREGUNTAS FRECUENTES (ACCORDION) */
    .faq-accordion-wrap {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .faq-item {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      transition: var(--transition-smooth);
    }

    .faq-item:hover {
      border-color: #CDC7B9;
    }

    .faq-question-bar {
      width: 100%;
      padding: 18px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      border: none;
      text-align: left;
      font-family: 'Inter', sans-serif;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      gap: 12px;
    }

    .faq-icon-arrow {
      font-size: 1.1rem;
      color: var(--text-muted);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    .faq-item.active .faq-icon-arrow {
      transform: rotate(180deg);
      color: var(--text-main);
    }

    .faq-answer-panel {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s cubic-bezier(0, 1, 0, 1);
      padding: 0 20px;
    }

    .faq-item.active .faq-answer-panel {
      max-height: 400px;
      transition: max-height 0.4s ease-in-out;
      padding-bottom: 20px;
    }

    .faq-answer-panel p {
      font-size: 0.84rem;
      color: var(--text-muted);
      line-height: 1.6;
      border-top: 1px dashed var(--border-color);
      padding-top: 14px;
    }

    /* CTA FINAL */
    .cta-banner-box {
      background-color: var(--bg-dark);
      color: white;
      border-radius: 16px;
      padding: 55px 25px;
      text-align: center;
      margin: 40px 0;
    }

    .cta-title {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 500;
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .cta-title i {
      font-style: italic;
      color: var(--accent-silver);
    }

    .cta-description {
      font-size: 0.88rem;
      color: #BDB9B0;
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto 30px;
    }

    .cta-btn-white {
      background: #FFFFFF;
      color: var(--bg-dark);
      padding: 14px 32px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: var(--transition-smooth);
    }

    .cta-btn-white:hover {
      background: var(--bg-cream);
      transform: translateY(-2px);
    }

    .cta-whatsapp-sub {
      margin-top: 20px;
      font-size: 0.8rem;
      color: #9C978F;
    }

    .cta-whatsapp-sub a {
      color: #FFFFFF;
      font-weight: 600;
      text-decoration: underline;
    }

    /* FOOTER */
    .site-footer {
      background-color: #0E0E0E;
      color: #A39E94;
      padding: 60px 0 35px;
      border-top: 1px solid var(--border-dark);
    }
