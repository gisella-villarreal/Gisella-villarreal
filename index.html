<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gisella Villarreal | Portfolio & Shop</title>
  
  <!-- Tipografías elegantes -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Librería de Iconos Profesionales (Minimalistas) -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-color: #FAFAFA;    /* Blanco un poco más suave para el fondo */
      --white: #FFFFFF;
      --primary: #C1297E;     /* Fuchsia Pink */
      --accent: #FF7538;      /* Orange Peel */
      --text-dark: #1A1A1A;
      --text-light: #666666;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-dark);
      padding-bottom: 90px; 
      -webkit-font-smoothing: antialiased;
    }
    
    /* Cabecera con degradado premium y bordes redondeados */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
      padding: 80px 20px 60px 20px;
      text-align: center;
      border-radius: 0 0 35px 35px; /* Curva moderna estilo app */
      box-shadow: 0 10px 30px rgba(193, 41, 126, 0.2);
    }
    
    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.6rem;
      font-weight: 500;
      letter-spacing: 3px;
      color: var(--white);
      line-height: 1.15;
      margin-bottom: 15px;
    }
    
    header p {
      font-size: 0.85rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 35px;
    }
    
    .btn-hero {
      display: inline-block;
      background-color: var(--white);
      color: var(--primary);
      padding: 15px 32px;
      text-decoration: none;
      font-weight: 500;
      border-radius: 50px;
      letter-spacing: 1px;
      font-size: 0.85rem;
      text-transform: uppercase;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      transition: transform 0.2s ease;
    }
    
    /* Sección principal */
    .section { padding: 45px 20px 20px; }
    
    .section-title {
      font-family: 'Playfair Display', serif;
      text-align: center;
      font-size: 1.8rem;
      font-weight: 500;
      color: var(--text-dark);
      margin-bottom: 30px;
    }
    
    /* Tarjetas de servicios - Estilo Glass/Limpio */
    .cards {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    
    .card {
      background: var(--white);
      padding: 30px 15px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.04); /* Sombra súper suave */
      border: 1px solid rgba(0,0,0,0.02);
    }
    
    /* Iconos dentro de las tarjetas */
    .card i {
      font-size: 2.5rem;
      color: var(--primary);
      margin-bottom: 15px;
      display: block;
    }
    
    .card h3 { 
      font-family: 'Playfair Display', serif;
      font-size: 1.15rem; 
      font-weight: 600;
      color: var(--text-dark);
      margin-bottom: 8px; 
    }
    
    .card p { 
      font-size: 0.8rem; 
      color: var(--text-light); 
      line-height: 1.5; 
      font-weight: 300;
    }
    
    /* Menú Inferior (App) - Limpio y profesional */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: var(--white);
      display: flex;
      justify-content: space-around;
      padding: 15px 0 20px 0;
      box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
      z-index: 1000;
      border-radius: 25px 25px 0 0;
    }
    
    .nav-item {
      text-decoration: none;
      color: #A0A0A0;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: color 0.3s ease;
    }
    
    .nav-item i { font-size: 1.5rem; margin-bottom: 4px; }
    
    .nav-item.active { color: var(--accent); }
    
    .nav-item span { 
      font-size: 0.65rem; 
      font-weight: 500;
    }
  </style>
</head>
<body>

  <header>
    <h1>GISELLA<br>VILLARREAL</h1>
    <p>Marketing · Contenido · E-commerce</p>
    <a href="#" class="btn-hero">Conoce mi historia</a>
  </header>

  <div class="section">
    <h2 class="section-title">Explora mi mundo</h2>
    <div class="cards">
      
      <!-- Tarjeta 1 -->
      <div class="card">
        <i class="ph-light ph-aperture"></i>
        <h3>Fotografía</h3>
        <p>Estrategia visual para marcas.</p>
      </div>
      
      <!-- Tarjeta 2 -->
      <div class="card">
        <i class="ph-light ph-laptop"></i>
        <h3>E-commerce</h3>
        <p>Marketing y experiencias.</p>
      </div>
      
      <!-- Tarjeta 3 -->
      <div class="card">
        <i class="ph-light ph-sparkle"></i>
        <h3>Shop Beauty</h3>
        <p>Skincare y herramientas.</p>
      </div>
      
      <!-- Tarjeta 4 -->
      <div class="card">
        <i class="ph-light ph-headphones"></i>
        <h3>Música</h3>
        <p>Covers y arte sonoro.</p>
      </div>

    </div>
  </div>

  <!-- Navegación con iconos profesionales -->
  <nav class="bottom-nav">
    <a href="#" class="nav-item active">
      <i class="ph-fill ph-house"></i>
      <span>Inicio</span>
    </a>
    <a href="#" class="nav-item">
      <i class="ph-light ph-user"></i>
      <span>Sobre mí</span>
    </a>
    <a href="#" class="nav-item">
      <i class="ph-light ph-briefcase"></i>
      <span>Servicios</span>
    </a>
    <a href="#" class="nav-item">
      <i class="ph-light ph-shopping-bag"></i>
      <span>Shop</span>
    </a>
    <a href="#" class="nav-item">
      <i class="ph-light ph-music-notes"></i>
      <span>Música</span>
    </a>
  </nav>

</body>
</html>
