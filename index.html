<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gisella Villarreal | Portfolio & Shop</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,600;1,700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-cream: #F4F1ED;     
      --bg-dark: #151515;      
      --text-main: #1A1A1A;    
      --text-light: #666666;   
      --border-color: #E2DDD5; 
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      padding-bottom: 90px; 
      -webkit-font-smoothing: antialiased;
    }
    
    .page-wrapper {
      max-width: 100%;
      margin: 0 auto;
    }
    
    .hero {
      padding: 30px 20px 30px;
    }

    /* BARRA SUPERIOR: SOLO BADGE DE NOVEDADES */
    .top-bar {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: 25px;
    }
    
    .badge {
      display: inline-flex;
      align-items: center;
      background: transparent;
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.7rem;
      margin-bottom: 0;
    }
    .badge span {
      background: var(--bg-dark);
      color: white;
      padding: 2px 8px;
      border-radius: 10px;
      margin-right: 8px;
      font-weight: 500;
    }
    
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.5rem;
      font-weight: 500;
      line-height: 1.05;
      letter-spacing: -1px;
      margin-bottom: 20px;
      color: var(--bg-dark);
    }
    .hero h1 i {
      font-weight: 400;
      font-style: italic;
      color: var(--text-light);
    }
    
    .desktop-break {
      display: none;
    }
    
    .hero p {
      font-size: 0.9rem;
      color: var(--text-light);
      line-height: 1.5;
      margin-bottom: 30px;
      max-width: 90%;
    }
    
    .button-group {
      display: flex;
      gap: 15px;
      margin-bottom: 40px;
    }
    .btn-dark {
      background-color: var(--bg-dark);
      color: white;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-outline {
      background-color: transparent;
      color: var(--text-main);
      padding: 12px 0;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    /* FOTO PRINCIPAL LOCAL */
    .hero-image {
      width: 100%;
      height: 480px; 
      border-radius: 12px;
      background-image: url('1791056211701~2.jpg');
      background-size: cover; 
      background-position: center; 
      background-repeat: no-repeat;
    }

    .black-stats {
      background-color: var(--bg-dark);
      color: white;
      margin: 30px 16px; 
      border-radius: 16px;
      padding: 30px 10px; 
      display: grid;
      grid-template-columns: 1fr 1fr 1fr; 
      align-items: center;
