<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RocoGirl Skincare | Shop</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-cream: #F8F7F3;     /* Fondo claro principal */
      --bg-features: #EAE6DB;  /* Fondo un poco más oscuro para los iconos de abajo */
      --text-main: #1A1A1A;    
      --text-light: #5A5A5A;   
      --text-accent: #9A8068;  /* Color café suave para el "You" */
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
    }
    
    .page-wrapper {
      max-width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    
    /* ====== BARRA SUPERIOR ====== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 25px 20px 10px;
    }

    .menu-icon, .cart-icon {
      font-size: 1.6rem;
      color: var(--text-main);
      cursor: pointer;
      position: relative;
    }

    .logo {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 2px;
      color: var(--text-main);
    }

    .logo span {
      font-size: 0.5rem;
      font-weight: 500;
      letter-spacing: 4px;
      color: var(--text-light);
      text-transform: uppercase;
    }

    .cart-badge {
      position: absolute;
      top: -5px;
      right: -5px;
      background-color: var(--text-main);
      color: white;
      font-size: 0.55rem;
      font-weight: 700;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      border: 2px solid var(--bg-cream);
    }

    /* ====== HERO TEXT ====== */
    .hero-content {
      padding: 20px 20px 0;
    }

    .hero-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 3.2rem;
      font-weight: 500;
      line-height: 1.1;
      color: var(--text-main);
      margin-bottom: 20px;
      letter-spacing: -0.5px;
    }

    .hero-content h1 i {
      color: var(--text-accent);
      font-weight: 600;
    }

    .hero-content p {
      font-size: 0.85rem;
      color: var(--text-light);
      line-height: 1.6;
      margin-bottom: 30px;
      max-width: 320px;
      font-weight: 400;
    }

    .shop-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background-color: var(--text-main);
      color: white;
      padding: 12px 28px;
      border-radius: 30px; /* Botón tipo píldora */
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      transition: background-color 0.2s;
    }

    .shop-btn:hover {
      background-color: #333;
    }

    .shop-btn i {
      font-size: 1rem;
    }

    /* ====== IMAGEN DEL PRODUCTO ====== */
    .product-image-container {
      width: 100%;
      height: 45vh; /* Se adapta a la pantalla */
      min-height: 350px;
      margin-top: 20px;
      /* AQUÍ PUEDES PONER LA URL DE TU FOTO DE PRODUCTOS ROCOGIRL */
      background-image: url('https://images.unsplash.com/photo-1620916566398-39f1143ab7be?q=80&w=800&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      /* Un pequeño degradado para que se funda con el fondo si es necesario */
      mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, black 80%, transparent 100%);
    }

    /* ====== CARACTERÍSTICAS (FEATURES) ====== */
    .features-section {
      background-color: var(--bg-features);
      border-radius: 24px 24px 0 0; /* Bordes curvos solo arriba */
      padding: 30px 15px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-top: -20px; /* Sube un poco para superponerse a la imagen */
      position: relative;
      z-index: 2;
      flex-grow: 1;
    }

    .feature-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex: 1;
      padding: 0 5px;
    }

    .feature-item i {
      font-size: 1.8rem;
      color: var(--text-main);
      margin-bottom: 12px;
      font-weight: 300;
    }

    .feature-item p {
      font-size: 0.6rem;
      font-weight: 600;
      color: var(--text-main);
      line-height: 1.3;
    }

    /* ====== OVERLAY MENÚ EMERGENTE ====== */
    .overlay-menu {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: var(--bg-cream);
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .overlay-menu.active {
      opacity: 1;
      visibility: visible;
    }
    .close-btn {
      position: absolute;
      top: 30px; right: 30px;
      font-size: 2rem;
      color: var(--text-main);
      cursor: pointer;
    }
    .overlay-content {
      display: flex;
      flex-direction: column;
      gap: 30px;
      text-align: center;
    }
    .overlay-content a {
      text-decoration: none;
      color: var(--text-main);
      font-family: 'Playfair Display', serif;
      font-size: 2.5rem;
      font-style: italic;
      font-weight: 500;
      transition: color 0.2s;
    }
    .overlay-content a:hover {
      color: var(--text-light);
    }

    /* MEDIA QUERIES PARA COMPUTADORA */
    @media (min-width: 768px) {
      .page-wrapper {
        max-width: 480px; /* Mantiene la proporción de celular en computadoras */
        background-color: var(--bg-cream);
        box-shadow: 0 0 40px rgba(0,0,0,0.1);
      }
      .product-image-container {
        height: 400px;
      }
    }
  </style>
</head>
<body>

  <!-- MENÚ EMERGENTE (Igual al de inicio) -->
  <div class="overlay-menu" id="overlayMenu">
    <div class="close-btn" onclick="toggleMenu()">
      <i class="ph-bold ph-x"></i>
    </div>
    <div class="overlay-content">
      <a href="index.html">Inicio</a>
      <a href="servicios.html">Servicios</a>
      <!-- Te dirije al portafolio de la pág de inicio -->
      <a href="index.html#portafolio">Portafolio</a>
      <a href="shop.html">Shop</a>
    </div>
  </div>

  <div class="page-wrapper">
    
    <!-- BARRA SUPERIOR -->
    <header class="top-bar">
      <i class="ph ph-list menu-icon" onclick="toggleMenu()"></i>
      
      <div class="logo">
        <h2>ROCOGIRL</h2>
        <span>SKINCARE</span>
      </div>
      
      <div class="cart-icon">
        <i class="ph ph-shopping-bag"></i>
        <span class="cart-badge">2</span> <!-- Número de artículos en el carrito -->
      </div>
    </header>

    <!-- TEXTO PRINCIPAL -->
    <section class="hero-content">
      <h1>Healthy Skin.<br>Confident <i>You.</i></h1>
      <p>Science-backed skincare solutions<br>for every skin type and every you.</p>
      
      <a href="#productos" class="shop-btn">
        Shop Now <i class="ph ph-arrow-right"></i>
      </a>
    </section>

    <!-- IMAGEN DEL PRODUCTO (Reemplaza la URL en el CSS por la de tus productos) -->
    <div class="product-image-container"></div>

    <!-- SECCIÓN DE CARACTERÍSTICAS (FEATURES) -->
    <section class="features-section">
      <div class="feature-item">
        <i class="ph-light ph-leaf"></i>
        <p>Clean<br>ingredients</p>
      </div>
      <div class="feature-item">
        <i class="ph-light ph-flask"></i>
        <p>Dermatologist<br>Tested</p>
      </div>
      <div class="feature-item">
        <i class="ph-light ph-drop"></i>
        <p>For All<br>Skin Types</p>
      </div>
      <div class="feature-item">
        <i class="ph-light ph-rabbit"></i> <!-- Icono de conejo cruelty free -->
        <p>Cruelty<br>Free</p>
      </div>
    </section>

  </div>

  <!-- SCRIPT PARA ABRIR Y CERRAR EL MENÚ EMERGENTE -->
  <script>
    function toggleMenu() {
      const menu = document.getElementById('overlayMenu');
      menu.classList.toggle('active');
    }
  </script>

</body>
  </html>
