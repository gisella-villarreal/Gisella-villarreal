<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wedding Content Creator</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            /* Imagen de fondo de la página */
            background-image: url('31169de748f9b614f7b24379839c113d.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .bg-blur {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            backdrop-filter: blur(8px);
            background-color: rgba(255, 255, 255, 0.2);
            z-index: 1;
        }

        .poster-container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 600px;
        }

        .card {
            /* Imagen del marco vintage */
            background-color: transparent; 
            background-image: url('0100642d12339fb0a69c371dda00da04.jpg'); 
            background-size: 100% 100%; 
            background-position: center;
            background-repeat: no-repeat;
            
            padding: 65px 45px; /* Espaciado interno para que el óvalo encaje en el marco */
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .oval-mask {
            width: 85%;
            margin: 0 auto;
            aspect-ratio: 3 / 4.2;
            border-radius: 50%;
            overflow: hidden;
            position: relative;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.3);
        }

        /* Imagen principal dentro del óvalo */
        .oval-mask img.bg-photo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) contrast(1.1); 
        }

        .overlay-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            padding: 20px;
            background: radial-gradient(circle, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0.5) 100%);
        }

        .subtitle {
            font-size: 0.8rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
        }

        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            line-height: 0.95;
            margin-bottom: 20px;
            font-weight: 400;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
        }

        .swans-icon {
            width: 75px;
            margin-bottom: 20px;
            filter: drop-shadow(1px 1px 3px rgba(0,0,0,0.6));
        }

        .description {
            font-size: 0.9rem;
            letter-spacing: 1px;
            line-height: 1.4;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.7);
            max-width: 90%;
        }

        .poster-footer {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
            font-size: 0.85rem;
            line-height: 1.4;
        }

        .footer-left { text-align: left; }
        .footer-right { text-align: right; }
        .footer-light { font-weight: 300; font-style: italic; }

        @media (max-width: 500px) {
            .title { font-size: 2.5rem; }
            .card { padding: 45px 30px; }
        }
    </style>
</head>
<body>
    <div class="bg-blur"></div>
    
    <div class="poster-container">
        <div class="card">
            <!-- Centro Ovalado -->
            <div class="oval-mask">
                <img src="02157f477334b43b80802c91f8106e00.jpg" alt="Pareja Boda" class="bg-photo">
                
                <div class="overlay-content">
                    <p class="subtitle">Disfruta de una</p>
                    <h1 class="title">Wedding Content<br>Creator</h1>
                    
                    <!-- Icono de los cisnes habilitado -->
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4e/Swan_icon_white.svg" alt="Cisnes" class="swans-icon">
                    
                    <p class="description">Documentando tu gran<br>día en tiempo real</p>
                </div>
            </div>
        </div>

        <!-- Textos inferiores -->
        <div class="poster-footer">
            <div class="footer-left">
                Promoción boda<br>
                <span class="footer-light">Enero 2035</span>
            </div>
            <div class="footer-right">
                Silvana Ochoa Fotografía<br>
                <span class="footer-light">@sitioincreible</span>
            </div>
        </div>
    </div>
</body>
</html>
