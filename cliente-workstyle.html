<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workstyle | Marcela Ávila</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    :root {
      --bg-cream: #F4F1ED;
      --bg-dark: #151515;
      --text-main: #1A1A1A;
      --text-light: #666666;
      --border-color: #E2DDD5;
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      padding-bottom: 100px; 
      -webkit-font-smoothing: antialiased;
    }

    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      z-index: 10;
      color: white;
      text-decoration: none;
      background: rgba(0,0,0,0.5);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(5px);
    }
    
    .hero-banner {
      height: 55vh;
      width: 100%;
      background-size: cover;
      background-position: center;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 20px;
    }

    .hero-banner::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.4);
      z-index: 1;
    }

    .hero-banner-content {
      position: relative;
      z-index: 2;
      color: white;
    }

    .hero-banner-content h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      font-weight: 400;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .hero-banner-content p {
      font-size: 0.9rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: #E2DDD5;
    }

    .mosaic-title {
      text-align: center;
      padding: 30px 20px 15px;
    }
    .mosaic-title h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.8rem;
      font-weight: 400;
      color: var(--bg-dark);
      margin-bottom: 4px;
    }
    .mosaic-title p {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-light);
    }

    /* MOSAICO UNIDO (Espacio reducido a 3px y sin bordes redondeados exagerados) */
    .photo-mosaic {
      padding: 5px 8px 30px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px; 
    }

    .mosaic-item {
      width: 100%;
      background-size: cover;
      background-position: center;
      border-radius: 2px; 
      background-color: #E8E4DD;
    }

    .item-tall { height: 300px; }
    .item-square { height: 200px; }
    .item-wide { grid-column: span 2; height: 250px; }

    .bottom-nav {
      position: fixed; bottom: 0; width: 100%;
      background: var(--bg-cream);
      display: flex; justify-content: space-around;
      padding: 15px 0 20px 0;
      border-top: 1px solid var(--border-color);
      z-index: 1000;
    }
    .nav-item {
      text-decoration: none; color: #A0A0A0;
      display: flex; flex-direction: column; align-items: center;
    }
    .nav-item i { font-size: 1.4rem; margin-bottom: 4px; }
    .nav-item.active { color: var(--bg-dark); }
    .nav-item span { font-size: 0.6rem; font-weight: 500; }
  </style>
</head>
<body>

  <a href="portafolio.html" class="back-btn"><i class="ph-bold ph-arrow-left"></i> Volver</a>

  <div class="hero-banner" style="background-image: url('https://i.ibb.co/TMg4G9ZH/1791056211701-2.jpg');">
    <div class="hero-banner-content">
      <h1>Workstyle</h1>
      <p>Marcela Ávila</p>
    </div>
  </div>

  <div class="mosaic-title">
    <h2>Galería de la Sesión</h2>
    <p>Visual Stories</p>
  </div>

  <div class="photo-mosaic">
    <div class="mosaic-item item-tall" style="background-image: url('https://i.ibb.co/TMg4G9ZH/1791056211701-2.jpg');"></div>
    <div class="mosaic-item item-square" style="background-image: url('https://i.ibb.co/0RJH9dTJ/1791049708095-2.jpg');"></div>
    <div class="mosaic-item item-square" style="background-image: url('https://i.ibb.co/0RJH9dTJ/1791049708095-2.jpg');"></div>
    <div class="mosaic-item item-tall" style="background-image: url('https://i.ibb.co/TMg4G9ZH/1791056211701-2.jpg');"></div>
    <div class="mosaic-item item-wide" style="background-image: url('https://i.ibb.co/TMg4G9ZH/1791056211701-2.jpg');"></div>
    <div class="mosaic-item item-square" style="background-image: url('https://i.ibb.co/0RJH9dTJ/1791049708095-2.jpg');"></div>
    <div class="mosaic-item item-square" style="background-image: url('https://i.ibb.co/TMg4G9ZH/1791056211701-2.jpg');"></div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <i class="ph-light ph-house"></i>
      <span>Inicio</span>
    </a>
    <a href="sobre-mi.html" class="nav-item">
      <i class="ph-light ph-user"></i>
      <span>Sobre mí</span>
    </a>
    <a href="servicios.html" class="nav-item">
      <i class="ph-light ph-briefcase"></i>
      <span>Servicios</span>
    </a>
    <a href="shop.html" class="nav-item">
      <i class="ph-light ph-shopping-bag"></i>
      <span>Shop</span>
    </a>
  </nav>

</body>
</html>
