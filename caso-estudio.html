<head>

  <title>Caso de Estudio E-commerce | Gisella Villarreal</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,600;1,700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-cream: #F4F1ED;     
      --bg-dark: #151515;      
      --text-main: #1A1A1A;    
      --text-light: #666666;   
      --border-color: #E2DDD5; 
    }
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-cream);
      color: var(--text-main);
      padding-bottom: 90px; 
      -webkit-font-smoothing: antialiased;
    }
    
    .page-wrapper {
      max-width: 750px;
      margin: 0 auto;
      background-color: var(--bg-cream);
      min-height: 100vh;
      border-left: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      padding-bottom: 50px;
    }
    
    /* CABECERA DEL CASO */
    .case-header {
      padding: 40px 20px 20px;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      text-decoration: none;
      color: var(--text-light);
      margin-bottom: 20px;
      font-weight: 500;
